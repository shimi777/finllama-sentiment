seed: 42

models:
  plutus8b:
    hf_id: TheFinAI/plutus-8B-instruct
    load_in_4bit: true
  mistral7b:
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    load_in_4bit: true
  qwen25_7b:
    hf_id: Qwen/Qwen2.5-7B-Instruct
    load_in_4bit: true
  finbert:
    hf_id: ProsusAI/finbert
  finbert_tone:
    hf_id: yiyanghkust/finbert-tone
  vader: {}

inference:
  temperature: 0.0
  max_new_tokens: 20
  do_sample: false
  batch_size: 8

datasets:
  fpb:
    hf_id: TheFinAI/en-fpb
    config: sentences_75agree   # kept for compat, ignored by loader
    test_fraction: 0.20
  fiqa:
    hf_id: TheFinAI/fiqa-sentiment-classification
    neutral_band: 0.10

prompts:
  templates: [A, B, C]
  shots: [0, 3]  # 5-shot was descoped for time/budget reasons (disclosed in report §3)
  fewshot_source: fpb_train

paths:
  predictions_dir: results/predictions
  summary_dir: results/summary
